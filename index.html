<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>慢遊雲林：四季農產地圖</title>
    <!-- 使用穩定版 Tailwind CSS 樣式庫 -->
    <script src="https://tailwindcss.com"></script>
    <!-- 引入穩定的 Three.js 3D 渲染引擎與控制器 -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; background-color: #f4f1ea; }
        /* 固定 3D 畫布完全填滿左側區塊 */
        #canvas-container { width: 100%; height: 100%; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <!-- 頂部 UI：慢遊標題與月份選擇器 -->
    <div class="absolute top-6 left-1/2 -translate-x-1/2 z-10 w-[90%] max-w-3xl flex flex-col items-center gap-3 pointer-events-none">
        <div class="text-center">
            <h1 class="text-2xl font-bold text-[#3c4a3e] tracking-widest">慢遊雲林 MAP</h1>
            <p class="text-xs text-[#7a8a7c] mt-0.5">四季農產點讀互動地圖</p>
        </div>
        
        <!-- 月份水平拉條 -->
        <div class="glass-panel px-4 py-2 rounded-2xl shadow-sm flex items-center gap-1.5 w-full justify-between overflow-x-auto pointer-events-auto">
            <span class="text-xs font-bold text-[#4a5c4e] whitespace-nowrap px-2">時令月份:</span>
            <div class="flex gap-1" id="month-container"></div>
        </div>
    </div>

    <!-- 右側 UI：慢遊風格作物資訊卡 -->
    <div id="info-card" class="absolute top-36 right-6 z-10 glass-panel w-80 p-6 rounded-2xl shadow-xl transition-all duration-500 transform translate-x-96">
        <div class="flex justify-between items-start mb-2">
            <h2 id="town-name" class="text-2xl font-bold text-[#2d3a30]">鄉鎮名稱</h2>
            <span id="current-month-tag" class="bg-[#e4ece6] text-[#4a5c4e] text-xs px-2.5 py-1 rounded-full font-medium">11 月主要作物</span>
        </div>
        
        <!-- 插畫預留區 -->
        <div class="bg-[#ede9df] h-40 rounded-xl mb-4 flex flex-col items-center justify-center text-[#7a8a7c] text-sm border border-[#dfdace] overflow-hidden p-4 text-center">
            <span id="crop-icon" class="text-3xl mb-1">🌾</span>
            <span id="crop-placeholder" class="font-medium text-xs">作物照片展示區</span>
        </div>
        
        <h3 id="crop-name" class="text-lg font-bold text-[#3c4a3e] mb-2 border-b border-[#dfdace] pb-2">作物名稱</h3>
        <p id="crop-desc" class="text-[#5c6c5e] text-sm leading-relaxed min-h-[80px]">點擊左側地圖鄉鎮，漫遊雲林豐富的在地物產與風土故事。</p>
    </div>

    <!-- 左下角操作提示 -->
    <div class="absolute bottom-6 left-6 z-10 glass-panel px-4 py-2 rounded-xl text-[11px] text-[#7a8a7c] shadow-sm hidden md:block">
        🖱️ <b>操作指南：</b>滑鼠左鍵拖曳可旋轉地圖 · 滾輪可縮放大小 · 點擊地塊可查看作物
    </div>

    <!-- 3D 地圖畫布容器 (強制置底並占滿全螢幕) -->
    <div id="canvas-container" class="w-screen h-screen absolute top-0 left-0 -z-10"></div>

    <script>
        let currentMonth = 11;
        let selectedMesh = null;

        // 20個鄉鎮的 3D 地理相對座標分佈 (莫蘭迪文青綠色調)
        const townships = [
            { id: "mailiao", name: "麥寮鄉", x: -4.2, z: -3.2, color: 0x8fa895, icon: "🥬" },
            { id: "taixi", name: "臺西鄉", x: -5.0, z: -1.5, color: 0x9cb2a3, icon: "🦪" },
            { id: "sihu", name: "四湖鄉", x: -5.2, z: 0.8, color: 0x8fa895, icon: "🍉" },
            { id: "kouhu", name: "口湖鄉", x: -4.8, z: 2.8, color: 0x9cb2a3, icon: "🐟" },
            { id: "shuilin", name: "水林鄉", x: -3.0, z: 3.2, color: 0x7e9987, icon: "🍠" },
            { id: "beigang", name: "北港鎮", x: -1.6, z: 2.5, color: 0xa8bcae, icon: "🥜" },
            { id: "yuanchang", name: "元長鄉", x: -2.2, z: 1.0, color: 0x8fa895, icon: "🥜" },
            { id: "dongshi", name: "東勢鄉", x: -3.2, z: -0.8, color: 0x7e9987, icon: "🥕" },
            { id: "lunbei", name: "崙背鄉", x: -2.3, z: -2.4, color: 0xa8bcae, icon: "🥛" },
            { id: "erlun", name: "二崙鄉", x: -0.3, z: -2.8, color: 0x8fa895, icon: "🥬" },
            { id: "xiluo", name: "西螺鎮", x: 1.8, z: -2.8, color: 0x7e9987, icon: "🍉" },
            { id: "citong", name: "莿桐鄉", x: 3.6, z: -1.8, color: 0x9cb2a3, icon: "🧄" },
            { id: "linnei", name: "林內鄉", x: 5.4, z: -1.8, color: 0x7e9987, icon: "🍌" },
            { id: "douliu", name: "斗六市", x: 4.8, z: 0.2, color: 0x8fa895, icon: "🍊" },
            { id: "gukeng", name: "古坑鄉", x: 5.6, z: 2.4, color: 0x6e8a77, icon: "☕" }, 
            { id: "dounan", name: "斗南鎮", x: 2.8, z: 0.8, color: 0xa8bcae, icon: "🥔" },
            { id: "hwei", name: "虎尾鎮", x: 1.2, z: -0.8, color: 0x8fa895, icon: "🌽" },
            { id: "tuku", name: "土庫鎮", x: 0.2, z: 0.8, color: 0x7e9987, icon: "🧄" },
            { id: "dapi", name: "大埤鄉", x: 1.8, z: 2.6, color: 0x9cb2a3, icon: "🥬" },
            { id: "baozhong", name: "褒忠鄉", x: -1.0, z: -0.8, color: 0xa8bcae, icon: "🌽" }
        ];

        // 慢遊風農產資料庫
        const cropData = {
            "gukeng": { "11": { name: "古坑鄉 · 台灣咖啡", desc: "栽植於大尖山下的林蔭間，11月秋末冬初正是採收紅熟咖啡豆的季節。風味甘醇且不苦不澀，散發在地特有的細緻果香與木質調性。" } },
            "xiluo": { "7": { name: "西螺鎮 · 濁水溪西瓜", desc: "盛夏7月，河床沙地孕育出的西瓜碩大甜美。因為濁水溪豐富的礦物質滋養，果肉口感特別「沙甜」且飽含豐沛汁水。" }, "11": { name: "西螺鎮 · 獻納米", desc: "秋收時節，濁水溪灌溉的良質米粒粒飽滿。煮飯時滿室散發淡淡芋頭香氣，黏性適中，是老饕心中的頂級好米。" } },
            "citong": { "3": { name: "莿桐鄉 · 翠綠蒜頭", desc: "春季3月，莿桐的空氣裡飄散著濃郁蒜香。此地出產的大蒜蒜瓣肥大、汁多辣味濃，蒜素冠居全台，是帶動料理靈魂的極品。" } },
            "mailiao": { "11": { name: "麥寮鄉 · 翠玉美生菜", desc: "冬季強勁海風吹拂下，外銷等級的美生菜反而長得格外清脆甜美。11月起進入盛產期，色澤翠綠、口感宛如現摘般爽脆。" }}
        };

        // 1. 初始化 3D 渲染場景
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf4f1ea); // 溫潤米色背景

        // 相機與視角控制
        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 16, 16);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2.3; 

        // 溫和光源系統
        const ambientLight = new THREE.AmbientLight(0xfffdf6, 0.85);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xfffbf0, 0.5);
        dirLight.position.set(8, 15, 5);
        scene.add(dirLight);

        // 2. 建立 3D 地圖板塊群組
        const mapGroup = new THREE.Group();
        const meshMap = new Map();

        townships.forEach(town => {
            // 使用矮柱體製作「微立體地圖塊」
            const geometry = new THREE.CylinderGeometry(1.05, 1.05, 0.4, 6);
            const material = new THREE.MeshStandardMaterial({ 
                color: town.color, 
                roughness: 0.6,
                metalness: 0.05
            });
            const mesh = new THREE.Mesh(geometry, material);
            
            // 根據地理相對座標排列
            mesh.position.set(town.x * 1.5, 0, town.z * 1.4);
            mesh.rotation.y = Math.PI / 6; 
            mesh.userData = town;
            
            mapGroup.add(mesh);
            meshMap.set(town.id, mesh);
        });
        scene.add(mapGroup);
        mapGroup.position.set(0, 0, -0.5); 

        // 3. 渲染 1-12 月 UI 按鈕
        const monthContainer = document.getElementById('month-container');
        for (let i = 1; i <= 12; i++) {
            const btn = document.createElement('button');
            btn.innerText = `${i}月`;
            btn.className = `px-2.5 py-1 text-xs font-medium rounded-lg transition-all cursor-pointer ${i === currentMonth ? 'bg-[#4a5c4e] text-white shadow-sm font-bold' : 'text-[#5c6c5e] hover:bg-[#e4ece6]'}`;
            btn.onclick = () => {
                document.querySelectorAll('#month-container button').forEach(b => b.className = 'px-2.5 py-1 text-xs font-medium rounded-lg text-[#5c6c5e] hover:bg-[#e4ece6]');
                btn.className = 'px-2.5 py-1 text-xs font-medium rounded-lg bg-[#4a5c4e] text-white shadow-sm font-bold';
                currentMonth = i;
                if (selectedMesh) updateInfoCard(selectedMesh.userData);
            };
            monthContainer.appendChild(btn);
        }

        // 4. 滑鼠點擊與 3D 射線偵測
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            if (event.target.tagName === 'BUTTON' || event.target.closest('#info-card') || event.target.closest('#month-container')) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(mapGroup.children);

            if (intersects.length > 0) {
                const clickedMesh = intersects.object;
                
                if (selectedMesh) {
                    selectedMesh.material.color.setHex(selectedMesh.userData.color);
                    selectedMesh.position.y = 0;
                }

                selectedMesh = clickedMesh;
                selectedMesh.material.color.setHex(0xd4a373); // 點擊地塊變暖木色
                selectedMesh.position.y = 0.25; // 輕微上浮凸顯

                updateInfoCard(selectedMesh.userData);
            } else {
                if (selectedMesh) {
                    selectedMesh.material.color.setHex(selectedMesh.userData.color);
                    selectedMesh.position.y = 0;
                    selectedMesh = null;
                }
