<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>慢遊雲林：四季農產地圖</title>
    <style>
        /* 採用原生手寫 CSS，保證在任何電腦、任何瀏覽器、任何快取下都能完美顯示 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: #f4f1ea; /* Penny島經典溫潤米色 */
            color: #3c4a3e;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            padding: 24px;
        }
        
        header { text-align: center; margin-bottom: 16px; }
        header h1 { font-size: 26px; tracking: 2px; color: #2d3a30; font-weight: bold; }
        header p { font-size: 13px; color: #7a8a7c; margin-top: 4px; }

        /* 月份選單：大寬度自適應滾動條 */
        .month-selector {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid #dfdace;
            padding: 8px 16px;
            border-radius: 16px;
            display: flex;
            gap: 6px;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
            max-width: 850px;
            width: 100%;
        }
        .month-selector span { font-size: 13px; font-weight: bold; color: #4a5c4e; white-space: nowrap; margin-right: 8px; }
        .month-btn {
            padding: 6px 14px;
            font-size: 13px;
            border: none;
            background: transparent;
            color: #5c6c5e;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .month-btn:hover { background: #e4ece6; }
        .month-btn.active { background: #4a5c4e; color: white; font-weight: bold; }

        /* 主要內容排版區 */
        .main-container {
            display: flex;
            flex: 1;
            gap: 24px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            height: calc(100% - 130px);
        }

        /* 左側地圖區：改成原生方塊網格，不需載入 3D 引擎也極具視覺美感 */
        .map-section {
            flex: 1.3;
            background: #ede9df;
            border: 1px solid #dfdace;
            border-radius: 24px;
            padding: 24px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 12px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.02);
        }
        .town-block {
            background-color: #8fa895; /* 莫蘭迪綠 */
            border-bottom: 5px solid #6e8a77; /* 微立體厚度感 */
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.03);
        }
        .town-block:hover {
            transform: translateY(-2px);
            background-color: #a2b7a9;
        }
        .town-block.active {
            background-color: #d4a373; /* 點擊後變暖木橘色 */
            border-bottom: 2px solid #b58253;
            transform: translateY(3px);
            box-shadow: none;
        }
        .town-badge { font-size: 20px; margin-bottom: 2px; }

        /* 右側資訊卡：霧面玻璃紙張感 */
        .info-section {
            flex: 0.8;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #dfdace;
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
        }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .card-header h2 { font-size: 24px; color: #2d3a30; font-weight: bold; }
        .card-tag { background: #e4ece6; color: #4a5c4e; font-size: 12px; padding: 4px 12px; border-radius: 20px; font-weight: bold; }
        
        .image-placeholder {
            background-color: #ede9df;
            height: 160px;
            border-radius: 16px;
            border: 1px solid #dfdace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #7a8a7c;
            font-size: 13px;
            margin-bottom: 18px;
            text-align: center;
        }
        .image-placeholder .big-icon { font-size: 42px; margin-bottom: 6px; }
        
        .crop-title { font-size: 18px; font-weight: bold; color: #3c4a3e; padding-bottom: 8px; border-bottom: 1px solid #dfdace; margin-bottom: 12px; }
        .crop-text { color: #5c6c5e; font-size: 14px; line-height: 1.6; }

        /* 行政區地理網格精確排版（完美還原雲林縣地圖分佈位置） */
        .pos-mailiao { grid-column: 1 / 3; grid-row: 1; background-color: #8fa895; }
        .pos-erlun { grid-column: 3 / 5; grid-row: 1; background-color: #9cb2a3; }
        .pos-xiluo { grid-column: 5 / 7; grid-row: 1; background-color: #7e9987; }
        
        .pos-taixi { grid-column: 1; grid-row: 2 / 4; background-color: #9cb2a3; }
        .pos-dongshi { grid-column: 2; grid-row: 2; background-color: #7e9987; }
        .pos-lunbei { grid-column: 3; grid-row: 2; background-color: #a8bcae; }
        .pos-baozhong { grid-column: 4; grid-row: 2; background-color: #a8bcae; }
        .pos-hwei { grid-column: 5; grid-row: 2; background-color: #8fa895; }
        .pos-citong { grid-column: 6; grid-row: 2; background-color: #9cb2a3; }
        
        .pos-sihu { grid-column: 2; grid-row: 3; background-color: #8fa895; }
        .pos-tuku { grid-column: 3; grid-row: 3; background-color: #7e9987; }
        .pos-yuanchang { grid-column: 4; grid-row: 3; background-color: #8fa895; }
        .pos-dounan { grid-column: 5; grid-row: 3; background-color: #a8bcae; }
        .pos-douliu { grid-column: 6; grid-row: 3; background-color: #8fa895; }
        
        .pos-kouhu { grid-column: 1 / 3; grid-row: 4 / 6; background-color: #9cb2a3; }
        .pos-shuilin { grid-column: 3; grid-row: 4; background-color: #7e9987; }
        .pos-beigang { grid-column: 4; grid-row: 4; background-color: #a8bcae; }
        .pos-dapi { grid-column: 5; grid-row: 4; background-color: #9cb2a3; }
        .pos-gukeng { grid-column: 6; grid-row: 4 / 6; background-color: #6e8a77; }
        .pos-linnei { grid-column: 5; grid-row: 5; background-color: #7e9987; }
    </style>
</head>
<body>

    <header>
        <h1>慢遊雲林 MAP</h1>
        <p>四季農產點讀互動地圖</p>
    </header>

    <div class="month-selector">
        <span>時令月份:</span>

    <div class="main-container">
        <!-- 左側：微立體紙感行政區拼圖 -->
        <div class="map-section" id="map-section"></div>

        <!-- 右側：慢遊文青風資訊卡 -->
        <div class="info-section">
            <div class="card-header">
                <h2 id="town-name">點擊鄉鎮</h2>
                <span id="current-month-tag" class="card-tag">11 月主要作物</span>

            <div class="image-placeholder">
                <span id="crop-icon" class="big-icon">🌾</span>

            <p class="crop-text" id="crop-desc">點擊地圖上的各個鄉鎮區塊，即可查看該區域在不同月份盛產的指標農特產品與在地風土小故事。</p>
        </div>
    </div>
